name: Camera asset validation

on:
  push:
  pull_request:

jobs:
  camera-assets:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-sim.txt
      - name: Check every delivered URDF and mesh
        run: python scripts/validate.py --model all --no-write
      - name: Check sensor manifests without claiming optical calibration
        run: python scripts/sensor_manifest.py --model all --check
      - name: Compile, relocate and simulate every MJCF
        run: python -m unittest discover -s tests -v
